/* ============================================================
   Inspect — the specimen steps left, its record steps in
   ============================================================
   No cut away to a separate page: the archive stays on screen, the camera
   slides so the coral stands in the left of the frame, and the record comes
   in beside it. The specimen turns slowly on its own while it is being read,
   the way a piece on a turntable in a vitrine does. */
/* ------------------------------------------------------------------
   Language
   ------------------------------------------------------------------
   German is what the archive was written in, so it lives in corals.json
   itself; the other languages are overlays keyed by specimen id. Only the
   active language is fetched. Switching re-renders whatever is on screen
   rather than reloading, so the visitor keeps their place in the row. */
const LANGS = ['de', 'en', 'es'];
let lang = 'de';
let strings = {};
let overlay = {};
let aboutBlocks = [];

function t(key, vars){
  let out = strings[key] || key;
  if(vars) for(const k in vars) out = out.replaceAll(`{${k}}`, vars[k]);
  return out;
}

/* A specimen as the current language shows it: the German record with the
   overlay's fields laid over it, so a missing translation falls back to the
   original instead of to nothing. */
function L(spec){
  const over = overlay[spec.id];
  if(!over) return spec;
  const sc = spec.scenario || {};
  const os = over.scenario || {};
  return {...spec, ...over,
    scenario: {...sc, ...os,
      world: {...(sc.world || {}), ...(os.world || {})}},
    features: over.features || spec.features};
}

async function setLang(next){
  if(!LANGS.includes(next)) return;
  lang = next;
  document.documentElement.lang = next;
  try {
    // no-store like the specimen data: a cached locale file is why edited
    // copy silently fails to appear for hours
    const data = await (await fetch(`data/lang/${next}.json`, {cache: 'no-store'})).json();
    strings = data.ui || {};
    overlay = data.specimens || {};
    aboutBlocks = data.about || [];
  } catch { strings = {}; overlay = {}; aboutBlocks = []; }
  try { localStorage.setItem('corals-lang', next); } catch {}

  document.querySelectorAll('#langSwitch button').forEach(b =>
    b.classList.toggle('on', b.dataset.lang === next));
  applyStrings();
  captionIndex = -1;                 // force the caption to redraw
  if(platesBuilt) buildPlates();
  if(inspectOpen) fillInspect(inspectIndex);
}

/* Every fixed label on the page, in one place. */
/* The invitation the participants were given, then what the archive is and
   what its scenarios hold to — all of it out of the locale file, because the
   whole panel has to change language with the rest of the page. */
/* The photographs of the stations live here rather than in the locale files:
   the caption under each one is translated, the file it points at is not. A
   block names its photograph by key, so the same picture keeps its place in
   the text in every language, and a photograph whose file is missing takes its
   caption with it rather than leaving a broken image in the middle of a
   paragraph. */
const AKTION_FOTOS = {
  tiefsee:    'assets/img/aktion/station-tiefsee.jpg',
  foyer:      'assets/img/aktion/station-foyer.jpg',
  riffbecken: 'assets/img/aktion/station-riffbecken.jpg',
};

function renderAbout(){
  const body = document.getElementById('aboutBody');
  if(!body) return;
  body.innerHTML = (aboutBlocks.length ? aboutBlocks : [{h: t('aboutTitle')}])
    .map((b, i) => {
      if(b.h)      return `<${i === 0 ? 'h3' : 'h4'}>${b.h}</${i === 0 ? 'h3' : 'h4'}>`;
      if(b.lead)   return `<p class="lead">${b.lead}</p>`;
      if(b.step)   return `<p class="step"><b>${b.step[0]}</b>${
                             b.step[1] ? `<span>${b.step[1]}</span>` : ''}</p>`;
      if(b.credit) return `<p class="credit">${b.credit}</p>`;
      if(b.sign)   return `<div class="sign">
                     <p class="who">${b.sign[0]}</p>
                     ${b.sign[1] ? `<p class="rolle">${b.sign[1]}</p>` : ''}
                     ${(b.links || []).map(([wo, handle, href]) =>
                       `<a href="${href}" target="_blank" rel="noopener noreferrer">
                          <span class="wo">${wo}</span>${handle}</a>`).join('')}
                   </div>`;
      if(b.figs)   return `<div class="shots">${b.figs.map(([key, cap]) => AKTION_FOTOS[key]
                     ? `<figure><img src="${AKTION_FOTOS[key]}" alt="${cap}" loading="lazy">
                        <figcaption>${cap}</figcaption></figure>` : '').join('')}</div>`;
      return `<p>${b.p}</p>`;
    }).join('');

  // A photograph that is not there yet takes its caption with it, and the last
  // one to go takes the strip — otherwise the paragraph is followed by a band
  // of empty space held for pictures nobody can see.
  body.querySelectorAll('.shots img').forEach(img => img.addEventListener('error', () => {
    img.closest('figure').hidden = true;
    const streifen = img.closest('.shots');
    if(!streifen.querySelector('figure:not([hidden])')) streifen.hidden = true;
  }));
}

function applyStrings(){
  const set = (sel, text, attr) => {
    const el = document.querySelector(sel);
    if(el) attr ? el.setAttribute(attr, text) : (el.textContent = text);
  };
  set('#enterBtn', t('enter'));
  set('#mode3d', t('mode3d'));
  set('#modeDraw', t('modeDraw'));
  set('#viewLine', t('viewLine'));
  set('#viewGrid', t('viewGrid'));
  set('#aboutBtn', t('aboutTitle'), 'title');
  set('#aboutBtn', t('aboutTitle'), 'aria-label');   // the glyph names nothing
  renderAbout();
  set('#aboutClose', t('close'));
  set('#aboutCloseTop', t('close'), 'aria-label');
  set('#langSwitch', t('langLabel'), 'title');
  document.getElementById('hint').textContent =
    t(mode === 'draw' ? 'hintDraw' : 'hint3d');
}

document.getElementById('langSwitch').addEventListener('click', (e) => {

const inspectEl = document.getElementById('inspect');
let inspectOpen = false, inspectIndex = -1;
let inspectAmount = 0;               // 0 archive, 1 record open; eased in frame()
const TURNTABLE = 0.16;              // radians per second while a record is open

function inspectHTML(rawSpec, index){
  const spec = L(rawSpec);
  const env = spec.scenario || {};
  const world = env.world || {sea: 0, marks: [], note: ''};

  return `
    <div>
      <h2>${META.baseSpecies}${spec.variety ? ` <em>${spec.variety}</em>` : ''}</h2>
      <div class="common">${spec.title}</div>
    </div>

    <div class="block">
      <div class="sec">${env.title || 'Umgebung'}</div>
      <div class="source">
        ${spec.reference ? '' : `<figure>
          <img loading="lazy" src="assets/img/drawing/${spec.id}.webp"
               alt="Zeichnung, auf die dieses Exemplar zurückgeht">
          <figcaption>${t('source')}${spec.author ? ' · ' + spec.author : ''}</figcaption>
        </figure>`}
        <div class="story">${env.story || spec.summary || ''}</div>
      </div>
    </div>

    <div class="block">
      <div class="sec">${t('range', {year: yearOf(spec)})}</div>
      <div id="inspectMap"></div>
      <div class="sealevel">${seaLabel(world.sea || 0, strings)}</div>
      <div class="mapnote">${world.note || ''}</div>
    </div>
`;
}

/* Put a specimen's record into the panel. Kept separate from opening it,
   because the record also has to follow when the visitor drags the row past
   other specimens — and moving the camera there would fight the drag. */
function fillInspect(index){
  inspectIndex = index;
  const spec = DATA[index];
  inspectEl.innerHTML = `<button id="inspectClose" title="Schließen (Esc)">×</button>`
    + inspectHTML(spec, index);
  const closeBtn = document.getElementById('inspectClose');
  closeBtn.title = t('closeEsc');
  closeBtn.addEventListener('click', closeInspect);

  // the map is drawn from the scenario's own sea level, so the coastlines a
  // visitor sees belong to that year and no other
  const world = (spec.scenario && spec.scenario.world) || {sea: 0, marks: []};
  document.getElementById('inspectMap').innerHTML =
    worldMapSVG({sea: world.sea || 0, marks: world.marks || [], cols: 58});
}

function openInspect(index){
  if(index < 0 || index > maxIndex) return;
  target = index; clampTarget();
  fillInspect(index);
  inspectOpen = true;
  inspectEl.classList.add('on');
  inspectEl.setAttribute('aria-hidden', 'false');
  document.body.classList.add('inspecting');
  messeBand();          // the sheet's real edge, not 54 % of anything
  hideHint();
}

function closeInspect(){
  if(!inspectOpen) return;
  inspectOpen = false;
  inspectEl.classList.remove('on');
  inspectEl.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('inspecting');
}

/* ============================================================
   Frame loop
   ============================================================ */
let lastStream = -99;
const clock = new THREE.Clock();

/* Where the camera stands for the current position and record state.
   Stand the specimen right of centre so the label has the left third to
   itself. On a wide screen the camera stays level and looks straight down -z;
   sliding it left is what moves the subject right, without tilting anything.
   Opening a record swings that offset through zero and out the other side, so
   the specimen crosses the frame to the left and the panel takes the right.
   A phone has no room beside the record, so there the camera tilts instead —
   see below.
   Returns the row position it is looking at. */
function placeCamera(){
  const x = current * SPACING;
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  let camX = x, camY = CAM_HIGH, camZ = CAM_DIST, blickY = CAM_HIGH;

  if(inspectAmount > 0.001){
    if(innerWidth <= 900){
      /* On a phone the record is a sheet along the bottom, so there is no side
         to step aside to — the specimen has to move up instead, into the strip
         between the header and the top of the sheet.

         A level camera cannot put it there. Standing the whole coral above the
         middle of the frame would mean lowering the camera below the seabed,
         which is why this used to cap the move and leave the foot behind the
         sheet. So the camera keeps its own height and tilts down instead, far
         enough back that foot and crown land exactly on the strip's edges. */
      const oben = bandOben, unten = bandUnten;
      const hoch = (mode === 'draw') ? CAM_HIGH + DRAW_FIT / 2 : FIT;
      const tief = (mode === 'draw') ? CAM_HIGH - DRAW_FIT / 2 : 0;
      // the angles the strip's own edges make with the camera's axis
      const unterKante = Math.atan(tan * (1 - 2 * unten / innerHeight));
      const oberKante  = Math.atan(tan * (1 - 2 * oben  / innerHeight));
      const spanne = Math.tan(Math.max(0.02, oberKante - unterKante));
      // the distance at which foot and crown subtend exactly that angle
      const p = hoch - CAM_HIGH, q = tief - CAM_HIGH, s = p - q;
      const zielZ = (s + Math.sqrt(s * s - 4 * spanne * spanne * p * q)) / (2 * spanne);
      // and the pitch that then drops the foot onto the strip's lower edge
      const neigung = Math.atan(q / zielZ) - unterKante;
      camZ = CAM_DIST + (zielZ - CAM_DIST) * inspectAmount;
      blickY = CAM_HIGH + camZ * Math.tan(neigung) * inspectAmount;
    } else {
      // At rest the specimen stands in the middle of the frame; with the record
      // open the camera steps right so the coral holds the left of the frame.
      camX = x + CAM_DIST * tan * camera.aspect * 0.3 * inspectAmount;
    }
  }
  camera.position.set(camX, camY + anflugHoch, camZ + anflugWeit);
  // the target stays down on the specimen, so rising tips the view over it
  camera.lookAt(camX, blickY, 0);
  camera.updateMatrixWorld();
  return x;
}

/* Put the label just above the specimen's crown. A drawing hangs centred on
   the camera's own height and is taller than a model, so the two need
   different tops. */
/* Both labels are anchored to where the camera is looking, not to a
   particular specimen. The camera tracks the row, so that point holds still
   on screen while the corals slide past it — the year stays put and counts,
   and the name stays put and changes. */
function placeCaption(){
  const focus = current * SPACING;
  const toScreen = (worldY) => {
    const v = new THREE.Vector3(focus, worldY, 0).project(camera);
    return [(v.x * 0.5 + 0.5) * innerWidth, (-v.y * 0.5 + 0.5) * innerHeight];
  };

  // Under the specimen, not over it: the coral stands from y = 0 upward, so
  // the name hangs just below its foot — and below the sheet in drawing mode.
  // On a phone it hangs a little further down than the arithmetic needs: the
  // axis was moved to the very bottom edge, and the gap it gave up belongs to
  // the coral rather than to the name.
  const eng = innerWidth <= 900;
  const foot = (mode === 'draw')
    ? CAM_HIGH - DRAW_FIT / 2 - (eng ? 0.18 : 0.3)
    : (eng ? -0.55 : -0.28);
  let [nx, ny] = toScreen(foot);
  // The name follows the specimen, and on a narrow screen the specimen leaves
  // the frame long before the name should. Hold it inside the viewport by its
  // own half-width — it stays centred under the coral until the coral runs out
  // of room, and then stops at the edge instead of sliding off it.
  // The name hangs under the specimen, and the specimen sits lower in the frame
  // the shorter the window is — on a 1200x700 desktop it came within eight
  // pixels of the axis's own year. It stops above the axis instead, which is a
  // limit every format needs, not only a phone.
  const strahl = document.getElementById('timeline').getBoundingClientRect();
  const kasten = capEl.getBoundingClientRect();
  // the name hangs downward from ny, so it is its lower edge that has to clear
  // the axis — clamping the upper one left it eight pixels short
  ny = Math.min(ny, strahl.top - kasten.height - 26);

  const halb = kasten.width / 2;
  const rand = 12;
  // On a screen too narrow even for the shortened name there is no honest
  // clamp, so it simply centres rather than pinning itself to one edge.
  nx = (halb * 2 + rand * 2 >= innerWidth)
     ? innerWidth / 2
     : Math.max(halb + rand, Math.min(innerWidth - halb - rand, nx));
  capEl.style.transform = `translate(${nx}px, ${ny}px) translate(-50%, 0)`;
  /* Fades out before it can run into the axis along the bottom — and stays
     away for the whole of the intro. This is an inline value, so it overrides
     the stylesheet's own intro rule: without the first test the name hangs in
     open water all through the descent, naming a coral that is not there yet. */
  capEl.style.opacity =
    (document.body.classList.contains('introing') || ny > innerHeight - 92) ? '0' : '1';

  const [yx, yy] = toScreen((mode === 'draw') ? CAM_HIGH : FIT * 0.52);
  yearBackEl.style.transform = `translate(${yx}px, ${yy}px) translate(-50%, -50%)`;

  // The year runs between the two specimens the row is currently between, so
  // scrolling counts it up rather than snapping it from one value to the next.
  const lo = Math.max(0, Math.min(maxIndex, Math.floor(current)));
  const hi = Math.max(0, Math.min(maxIndex, lo + 1));
  const f = Math.max(0, Math.min(1, current - lo));
  const a = yearOf(DATA[lo]), b = yearOf(DATA[hi]);
  const running = Math.round(a + (b - a) * f);
  if(running !== shownYear){
    shownYear = running;
    // one cell per digit, so the number counts without shifting sideways
    capYear.innerHTML = String(running).split('').map(d => `<i>${d}</i>`).join('');
  }
}

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  if(gridOpen) return;

  current += (target - current) * 0.09;
  inspectAmount += ((inspectOpen ? 1 : 0) - inspectAmount) * 0.07;
  const x = placeCamera();

  // The record follows the row. Dragging past other specimens used to leave
  // the panel on whichever one was clicked, so it described the wrong coral.
  if(inspectOpen){
    const here = Math.max(0, Math.min(maxIndex, Math.round(current)));
    if(here !== inspectIndex) fillInspect(here);
  }

  // the specimen being read turns slowly on the spot
  if(inspectOpen && !rotatingSlot && !reducedMotion.matches){
    const slot = slots[inspectIndex];
    if(slot && slot.model){
      slot.spin += TURNTABLE * dt;
      slot.model.rotation.y = slot.baseYaw + slot.spin;
    }
  }

  placeCaption();
  if(Math.abs(current - lastStream) > 0.4){ lastStream = current; updateStreaming(); }
  if(env) env.update(current, dt, x);
  updateCaption();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  passeAbstandAn();
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   Boot
   ============================================================ */
(async function boot(){
  const saved = (() => { try { return localStorage.getItem('corals-lang'); } catch { return null; } })();
  await setLang(saved || (LANGS.find(c => navigator.language.startsWith(c)) || 'de'));
  bootTxt.textContent = t('boot');
  // no-store so an edit to the table shows up on the next reload
  const payload = await (await fetch('data/corals.json', {cache: 'no-store'})).json();
  META = payload.meta;

  // the sheet keeps the specimens in drawing order; the archive shows them in
  // the speculative order the scenarios imply
  DATA = payload.specimens.slice().sort((a, b) => yearOf(a) - yearOf(b));
  maxIndex = DATA.length - 1;
  const years = DATA.map(yearOf);
  minYear = Math.min(...years);
  maxYear = Math.max(...years);

  bootProgress(0.3);
  DATA.forEach(makeSlot);
  env = new Environment(scene, {spacing: SPACING, specimens: DATA});
  buildTimeline();
  updateCaption();
  buildIntroGrid();

  bootTxt.textContent = t('bootFirst');
  bootProgress(0.65);
  await new Promise(resolve => {
    loadModel(slots[0]);
    const check = setInterval(() => { if(slots[0].model){ clearInterval(check); resolve(); } }, 60);
    setTimeout(() => { clearInterval(check); resolve(); }, 7000);
  });

  updateStreaming();
  bootProgress(1);
  target = current = 0;
  frame();

  setTimeout(() => {
    const b = document.getElementById('boot');
    b.classList.add('gone');
    setTimeout(() => b.remove(), 800);
    target = current = 0;
    inputLocked = false;
  }, 300);

  // The overview is measured before it is ever shown, so every cell needs a
  // real size by then. Building the wall while the archive is idle keeps that
  // work — sixty-two nodes and their images — out of the first view change.
  const prebuild = () => { if(!platesBuilt) buildPlates(); };
  if('requestIdleCallback' in window) requestIdleCallback(prebuild, {timeout: 4000});
  else setTimeout(prebuild, 1500);
})();
</script>
