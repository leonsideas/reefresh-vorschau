<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reefresh, Maybe Next Time</title>
<style>
  /* Two faces. Hello Mixed carries the headings — and unlike the three display
     faces tried before it (Sound Distortion, Mixed Up, Yavome) it holds 412
     glyphs including digits and umlauts, so a heading no longer falls through
     to something else mid-word. Of the characters the archive actually sets in
     headings only the ellipsis is missing; that one drops to Satoshi.
     Satoshi carries the running text, and its weight axis still separates
     emphasis (600) from body (400) inside it.

     These two are the only faces left in the repository. The four the archive
     tried and dropped — Dirtyline, Mixed Up, Sound Distortion, Yavome — were
     licensed for personal use only and are gone: Yavome even carries fsType 4,
     which forbids embedding beyond preview and print. Satoshi is cleared for
     commercial use and self-hosting (ITF Free Font License, kept beside it).
     Hello Mixed is licensed twice over, and the two cover different halves of
     this project: the webfont licence permits the embedded woff2 the browser
     loads, the desktop licence covers the logo, whose lettering travels as
     paths rather than as a font. Both were bought on 2026-09-03; the note
     beside them in assets/font/licence/ says which applies where, and what the
     pageview limit means for an exhibition terminal. What ships is the
     TrueType build, indistinguishable from the purchased OTF in an overlay at
     180px and a third of its weight. */
  @font-face{
    font-family:"Hello Mixed";
    src:url("assets/font/hello-mixed.woff2") format("woff2"),
        url("assets/font/hello-mixed.ttf") format("truetype");
    font-weight:400;font-style:normal;font-display:swap;
  }
  @font-face{
    font-family:"Satoshi";
    src:url("assets/font/satoshi-variable.woff2") format("woff2"),
        url("assets/font/satoshi-variable.ttf") format("truetype");
    font-weight:300 900;font-style:normal;font-display:swap;
  }
  :root{
    --paper:#f4f2ee;
    --paper-soft:#faf9f7;
    --ink:#1a1e1f;
    --ink-soft:rgba(26,30,31,.58);
    --ink-faint:rgba(26,30,31,.38);
    --line:rgba(26,30,31,.15);
    --line-soft:rgba(26,30,31,.08);
    --chip:rgba(255,255,255,.62);
    --accent:#1f6f74;
    --text:"Satoshi","Helvetica Neue",Helvetica,Arial,sans-serif;
    --display:"Hello Mixed","Satoshi","Helvetica Neue",Helvetica,Arial,sans-serif;
    --panel-w:clamp(340px,34vw,460px);   /* the record panel; #timeline ends before it */
    --marke:url("assets/logo/marke.svg");
    --logo-w:clamp(250px,44vw,560px);    /* the mark, identical on both screens */
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  }
  /* deep or murky environments flip the interface to light-on-dark */
  body.on-dark{
    --ink:#eef4f6;
    --ink-soft:rgba(238,244,246,.66);
    --ink-faint:rgba(238,244,246,.4);
    --line:rgba(238,244,246,.22);
    --line-soft:rgba(238,244,246,.12);
    --chip:rgba(10,20,26,.4);
    --accent:#8fd6da;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--text);
    -webkit-font-smoothing:antialiased;overflow:hidden;
    transition:color .9s ease;
  }
  canvas{display:block}
  ::selection{background:var(--ink);color:var(--paper)}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  /* the intro hands focus to the archive's open button, so its ring is the
     first thing a visitor sees on arriving — it has to belong here */
  :focus-visible{outline:1px solid var(--accent);outline-offset:3px}

  /* the environment behind the specimen */
  #backdrop{
    position:fixed;inset:0;z-index:0;
    background:linear-gradient(180deg,var(--bg-top,#f4f2ee) 0%,var(--bg-bottom,#f4f2ee) 100%);
    transition:background 1s ease;
  }
  /* optional filmed plate; the gradient above tints it per scenario so one
     piece of footage can serve every specimen */
  #envvideo{
    position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity 1.2s ease;pointer-events:none;
  }
  #envvideo.on{opacity:var(--video-strength,.55)}
  #backdrop.over-video{mix-blend-mode:multiply}
  #backdrop::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120% 70% at 50% -10%,rgba(255,255,255,.5),transparent 62%);
    opacity:var(--glare,.5);transition:opacity 1s ease;
  }
  /* touch-action:none hands the gesture to the page instead of the browser.
     Without it the browser keeps the swipe for its own panning and zooming,
     delays the pointer events and cancels the stream mid-drag — which is what
     made browsing on a phone feel like it was fighting back. */
  #stage{position:fixed;inset:0;z-index:1;touch-action:none}
  #stage canvas{touch-action:none;-webkit-user-select:none;user-select:none}

  /* ---------- top bar ---------- */
  /* ---------- intro: a drifting grid of every specimen ---------- */
  #intro{
    /* fixed light palette: the intro must not follow the archive's dark
       environment, or its text lands on its own white background */
    --ink:#1a1e1f;
    --ink-soft:rgba(26,30,31,.58);
    --ink-faint:rgba(26,30,31,.38);
    --line:rgba(26,30,31,.15);
    position:fixed;inset:0;z-index:60;background:var(--paper);color:var(--ink);
    overflow:hidden;transition:opacity .55s ease,visibility .55s,
    background-color 1.3s cubic-bezier(.4,0,.3,1);
  }
  #intro.gone{opacity:0;visibility:hidden;pointer-events:none}
  #intro.handoff{background-color:rgba(244,242,238,0)}

  .mrows{
    position:absolute;inset:0;display:flex;flex-direction:column;
    justify-content:center;gap:clamp(10px,2.4vh,30px);
    transition:opacity .3s ease,filter .55s ease,transform .65s ease;
  }
  /* the row carries the exit; the track inside carries the endless drift, so
     leaving does not fight the marquee animation */
  .mrow{overflow:hidden;transition:transform 1.15s cubic-bezier(.6,0,.2,1),opacity .9s ease}
  .mtrack{display:flex;align-items:center;gap:clamp(14px,3vw,44px);width:max-content}
  .mtrack img{
    height:clamp(88px,15vh,170px);width:auto;object-fit:contain;flex:none;
    opacity:.9;transform-origin:50% 60%;
    transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .35s ease;
  }
  /* a specimen lifts a little when the pointer finds it */
  .mtrack img:hover{transform:scale(1.14);opacity:1}
  .mrow[data-dir="l"] .mtrack{animation:driftL var(--dur,64s) linear infinite}
  .mrow[data-dir="r"] .mtrack{animation:driftR var(--dur,64s) linear infinite}
  @keyframes driftL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes driftR{from{transform:translateX(-50%)}to{transform:translateX(0)}}

  /* ---- leaving: the field clears, and the thanks are read on the empty page ----
     The rows leave the way they arrived — each one out of the side it was
     drifting towards — and the mark goes with them, so what is left is the
     paper the intro started from. */
  #intro.raeumt .mtrack{animation-play-state:paused}
  #intro.raeumt .mrow[data-dir="l"]{transform:translateX(-112%)}
  #intro.raeumt .mrow[data-dir="r"]{transform:translateX(112%)}
  #intro.raeumt .mcentre{opacity:0;transform:translate(-50%,-50%) scale(.97)}
  #intro.raeumt .mscrim{opacity:0}

  .dank{
    position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:clamp(24px,4.5vh,44px);
    padding:40px;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .7s ease;
  }
  .dank.on{opacity:1}
  .dank p{
    /* The display face, like everything else the intro says out loud. It sets
       wider and lower-contrast than the text face, so it needs a little more
       size and a little less line to hold together. */
    font-family:var(--display);font-weight:400;
    max-width:30ch;margin:0;font-size:clamp(15px,1.9vw,19px);line-height:1.6;
    letter-spacing:.02em;color:var(--ink-soft);text-wrap:balance;
  }
  /* Institution marks come in every proportion there is, so they are set to a
     common height and left in their own colours — a supporter's mark is not
     ours to recolour. */
  .dank-logos{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:clamp(26px,4vw,60px);max-width:min(900px,86vw);
  }
  .dank-logos img{height:clamp(32px,5.2vh,56px);width:auto;object-fit:contain}

  /* On entry, the moving field resolves into the archive's chronological axis. */
  #intro.assembling .mtrack{animation-play-state:paused}
  #intro.assembling .mrows{opacity:.06;filter:blur(5px);transform:scale(.985)}
  #intro.assembling .mcentre{opacity:0;transform:translate(-50%,-50%) scale(.97)}

  .archive-assembly{position:absolute;inset:0;z-index:5;pointer-events:none}
  /* No drop-shadow here. A blurred filter is re-rasterised every frame it
     moves, and this is dozens of them moving at once — it was the single
     most expensive thing in the formation, for a shadow that is only ever
     seen in flight and dissolves at the handoff. */
  .archive-piece{
    position:absolute;z-index:1;display:block;max-width:none;object-fit:contain;
    transform-origin:50% 100%;will-change:transform,opacity;
  }

  /* a soft veil so the title always sits clear of the specimens behind it */
  .mscrim{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(58% 44% at 50% 50%,
      var(--paper) 0%, rgba(244,242,238,.94) 38%, rgba(244,242,238,0) 74%);
    transition:opacity .9s ease;
  }
  #intro.assembling .mscrim{opacity:0}

  .mcentre{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;transition:opacity .8s ease,transform 1s ease;
  }
  /* the heading's box is the mark and nothing else, so centring .mcentre
     centres the mark itself — the same point the boot screen used */
  .mcentre h1{line-height:0;cursor:pointer}
  /* Plain label, no box — the same treatment the header buttons got. A hairline
     underneath is all the affordance it needs, and dropping the padding lines
     it up with the loading text it fades out of. */
  .mcentre .enter{
    font-family:var(--display);
    position:absolute;left:50%;top:calc(100% + 30px);transform:translateX(-50%);
    white-space:nowrap;padding:4px 0 5px;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-soft);background:none;
    box-shadow:inset 0 -1px 0 var(--line);transition:color .25s,box-shadow .25s;
  }
  .mcentre .enter:hover{color:var(--ink);box-shadow:inset 0 -1px 0 var(--ink)}

  body.introing .topbar,body.introing #timeline,body.introing #caption,body.introing .hint{
    opacity:0;pointer-events:none !important;transition:opacity .8s ease .3s;
  }
  .topbar,#timeline,#caption,.hint{transition:opacity .8s ease}
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:55;
    display:flex;align-items:flex-start;justify-content:space-between;gap:24px;
    padding:26px 34px;pointer-events:none;
    transition:padding-right .62s cubic-bezier(.3,.8,.25,1);
  }
  /* Plain labels, no boxes. Space holds the groups apart, and the active
     choice is marked by full-strength ink with a hairline under it rather
     than by a filled chip. */
  .tools{pointer-events:auto;display:flex;align-items:center;gap:26px}
  .toggle{display:flex;align-items:center;gap:16px}
  #menuBtn{display:none}          /* only narrow screens fold the header away */
  .toggle button{
    font-family:var(--display);
    padding:4px 0 5px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-faint);transition:color .25s,box-shadow .25s;white-space:nowrap;
    box-shadow:inset 0 -1px 0 transparent;
  }
  .toggle button.on{color:var(--ink);box-shadow:inset 0 -1px 0 var(--ink)}
  .toggle button:not(.on):hover{color:var(--ink-soft)}
  /* the record takes the right edge, so the tools on that side step aside */
  body.inspecting .topbar{padding-right:calc(var(--panel-w) + 34px)}
  #langSwitch{gap:12px}
  #langSwitch button{letter-spacing:.12em}
  /* A mark, not a word. The ring is what makes it read as an icon rather than
     as punctuation left over at the end of a line — and it gives the glyph a
     shape to sit in, since a question mark alone hangs off-centre. */
  .iconbtn{
    font-family:var(--display);
    display:flex;align-items:center;justify-content:center;
    width:24px;height:24px;padding:0;font-size:13px;line-height:1;letter-spacing:0;
    border:1px solid var(--line);border-radius:50%;
    text-transform:uppercase;color:var(--ink-faint);flex:none;
    transition:color .25s,border-color .25s;
  }
  .iconbtn:hover{color:var(--ink);border-color:var(--ink-soft)}
  .iconbtn:hover{color:var(--ink)}

  /* ---------- specimen label ---------- */
  /* Only the year and the name. Number, environment and author all live in
     the record, and repeating them here just crowds the specimen. */
  /* The label rides above the specimen instead of sitting in a corner, so it
     always names the coral you are actually looking at. frame() writes the
     transform; everything here is only how it looks. */
  /* The name stands under the specimen, on one line: no max-width, so a long
     variety keeps its own row instead of breaking over two. */
  #caption{
    position:fixed;left:0;top:0;z-index:20;pointer-events:none;text-align:center;
    width:max-content;white-space:nowrap;
    transform:translate(-50%,0);
    transition:opacity .7s ease;
  }
  #caption .sci{font-family:var(--display);font-weight:400;
    font-size:clamp(1rem,1.6vw,1.35rem);letter-spacing:.05em;line-height:1.3}

  /* The year stands behind the specimen — z-index 0 puts it over the water
     column but under the canvas, so the coral occludes it. Held back far
     enough to read as ground rather than as a label. */
  #yearBack{
    position:fixed;left:0;top:0;z-index:0;pointer-events:none;
    transform:translate(-50%,-50%);transition:opacity .4s ease;
  }
  /* The year sets in the heading face — the first display font here to carry
     digits at all. It has no tabular figures though, and its digits run from
     880 to 1601 units wide, so a counting number would visibly breathe. Each
     digit therefore gets its own fixed cell, which is by hand what `tnum`
     would have done: 0.78em is the widest digit in this face. */
  #yearBack span{
    display:block;font-family:var(--display);
    font-size:clamp(7rem,20vw,17rem);line-height:.82;letter-spacing:.02em;
    color:var(--ink);opacity:.16;white-space:nowrap;
  }
  #yearBack span i{display:inline-block;width:.78em;text-align:center;font-style:normal}

  /* ---------- timeline axis ---------- */
  /* The axis stands in front of the canvas, not behind it. That is what makes
     it legible over the sea, and it is also the only place a pointer can
     reach it — the stage covers the whole viewport, so an axis behind it can
     never be clicked. It stays under the record and the overview.

     The container carries no opacity dial: the parts are weighted against
     each other instead, so the rail stays quiet while the marker reads as the
     one thing telling you where you are. */
  #timeline{
    position:fixed;left:34px;right:34px;bottom:34px;z-index:20;height:52px;
    pointer-events:none;user-select:none;
    transition:right .62s cubic-bezier(.3,.8,.25,1);
  }
  /* the record takes the right edge, so the axis ends before it */
  body.inspecting #timeline{right:calc(var(--panel-w) + 34px)}
  #timeline .axis{position:absolute;left:0;right:0;top:34px;height:1px;background:var(--line)}
  #timeline .span{position:absolute;top:30px;height:9px;width:1px;background:var(--line)}
  #timeline .span.first{left:0}
  #timeline .span.last{right:0}
  /* Only the marks take the pointer; the container stays transparent to it so
     a drag across the bottom of the screen still scrolls the archive. */
  #timeline .tick{
    position:absolute;top:30px;width:1px;height:5px;background:var(--ink-faint);
    pointer-events:auto;cursor:pointer;transition:height .25s,background .25s;
  }
  #timeline .tick::after{content:"";position:absolute;left:-6px;top:-14px;width:13px;height:26px}
  #timeline .tick:hover{height:11px;background:var(--ink)}
  #timeline .tick.on{height:14px;background:var(--ink)}
  #timeline .decade{position:absolute;top:34px;width:1px;height:1px}
  #timeline .decade i{position:absolute;left:0;top:0;width:1px;height:7px;background:var(--line)}
  #timeline .decade span{
    position:absolute;left:0;top:12px;transform:translateX(-50%);
    font-size:9.5px;letter-spacing:.16em;color:var(--ink-faint);white-space:nowrap;
  }
  #timeline .marker{
    position:absolute;top:22px;width:1px;height:21px;background:var(--ink);
    transition:left .35s cubic-bezier(.2,.7,.2,1);
  }
  #timeline .marker b{
    position:absolute;left:50%;top:-19px;transform:translateX(-50%);
    font-size:10px;letter-spacing:.14em;font-weight:400;color:var(--ink);white-space:nowrap;
    font-variant-numeric:tabular-nums;   /* the year changes in place */
  }
  .hint{
    position:fixed;right:34px;bottom:100px;z-index:30;max-width:230px;text-align:right;
    font-size:9.5px;letter-spacing:.2em;line-height:1.9;color:var(--ink-faint);
    text-transform:uppercase;pointer-events:none;transition:opacity .6s;
  }
  .hint.gone{opacity:0}

  /* ---------- grid overview ---------- */
  #grid{
    position:fixed;inset:0;z-index:50;overflow-y:auto;background:var(--paper);color:var(--ink);
    opacity:0;pointer-events:none;transition:opacity .4s;
  }
  #grid.on{opacity:1;pointer-events:auto}
  /* No cards, no rules, no captions: the overview is the specimens themselves,
     standing together on one sheet. Everything a visitor might want to read
     about one of them is a click away in its record. */
  .plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:clamp(18px,2.4vw,40px);padding:0 clamp(20px,4vw,54px) 70px;
    align-items:end;margin-top:104px}   /* clear of the toolbar, which floats above */
  .plate{cursor:pointer;background:none;padding:0}
  .plate .imgwrap{display:flex;align-items:flex-end;justify-content:center}
  .plate img{
    max-width:100%;height:auto;object-fit:contain;
    transition:transform .5s cubic-bezier(.2,.7,.2,1);
  }   /* nur diese eine transition-Regel — eine zweite würde sie ersetzen */
  .plate:hover img{transform:translateY(-6px) scale(1.04)}
  /* the only word under a specimen is what it is */
  .plate .sci{
    font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.04em;
    line-height:1.4;color:rgba(26,30,31,.62);margin-top:12px;text-align:center;
    transition:color .25s;
  }
  .plate:hover .sci{color:#1a1e1f}
  /* The overview is always the light plate wall, even in a dark environment —
     and so is the toolbar while it stands over it. Without this the bare
     labels are light ink on light paper and simply vanish. */
  /* The whole light set, not only the ink: the folded-out menu paints itself
     with --chip and draws its switches with --line, and a dark chip and a
     light hairline over the plate wall gave a grey card with switches that
     could not be read. */
  body.on-dark #grid,
  body.on-dark.gridding .topbar{
    --ink:#1a1e1f;--ink-soft:rgba(26,30,31,.58);--ink-faint:rgba(26,30,31,.42);
    --line:rgba(26,30,31,.15);--line-soft:rgba(26,30,31,.08);
    --chip:rgba(255,255,255,.78);
  }

  /* ---------- inspect: the specimen steps left, its record steps in ----------
     The archive never cuts away. Clicking a specimen slides the camera so the
     coral stands in the left of the frame, and the record it belongs to comes
     in beside it. Everything here has to fit without scrolling — the panel is
     a label on a case, not an article. */
  #inspect{
    /* the toolbar sits on the left now, so the record owns the right edge
       from the very top of the screen down */
    position:fixed;top:0;right:0;bottom:0;z-index:45;
    width:var(--panel-w);
    display:flex;flex-direction:column;gap:15px;
    padding:30px 34px 26px;
    /* the heading now leads the panel, so it keeps clear of the close button */
    background:var(--chip);backdrop-filter:blur(14px);
    border-left:1px solid var(--line);
    color:var(--ink);
    transform:translateX(102%);opacity:0;pointer-events:none;
    transition:transform .62s cubic-bezier(.3,.8,.25,1),opacity .4s ease;
    overflow-y:auto;overscroll-behavior:contain;
  }
  /* Never let a block shrink under its own text. A panel one line too tall
     should scroll, not print two sections on top of each other — which is
     exactly what flex's default shrink does on a short screen. */
  #inspect > *{flex:none}
  #inspect::-webkit-scrollbar{width:6px}
  #inspect::-webkit-scrollbar-thumb{background:var(--line)}
  #inspect.on{transform:none;opacity:1;pointer-events:auto}

  #inspect .kicker{display:flex;justify-content:space-between;gap:14px;
    font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint)}
  #inspect h2{
    font-family:var(--display);font-weight:400;font-size:clamp(1.3rem,1.9vw,1.6rem);
    letter-spacing:.01em;line-height:1.3;margin-top:6px;padding-right:46px;
  }
  /* only the upright is loaded, and a synthesised slant on a species name
     reads as a rendering fault rather than as emphasis */
  #inspect h2 em{font-style:normal}
  #inspect .common{font-size:12px;letter-spacing:.05em;color:var(--ink-soft);margin-top:6px}

  /* the drawing this specimen was built from, beside its own record */
  #inspect .source{display:flex;gap:16px;align-items:flex-start}
  #inspect .source figure{flex:none;width:104px}
  #inspect .source img{
    display:block;width:100%;height:auto;background:var(--paper-soft);
    border:1px solid var(--line);
  }
  #inspect .source figcaption{
    font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-faint);margin-top:6px;line-height:1.5;
  }
  #inspect .story{font-size:12.5px;line-height:1.72;color:var(--ink-soft)}

  /* Section headings carry the display face too. Not uppercased: this face is
     already emphatic, and small caps in it stop being readable. */
  #inspect .sec{
    font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.04em;
    color:var(--ink-soft);
    border-bottom:1px solid var(--line-soft);padding-bottom:8px;margin-bottom:11px;
  }

  /* ---- the fictional distribution map ---- */
  .worldmap{width:100%;height:auto;display:block}
  .wm-sea{fill:transparent}
  .wm-shelf circle{fill:var(--ink-faint);opacity:.35}
  .wm-land circle{fill:var(--ink-soft)}
  .wm-grat line{stroke:var(--line);stroke-width:.5}
  .wm-halo{fill:var(--accent);opacity:.2}
  .wm-pin{fill:var(--accent)}
  #inspect .mapnote{font-size:11px;line-height:1.6;color:var(--ink-soft);margin-top:10px}
  #inspect .sealevel{
    font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);margin-top:7px;
  }

  #inspect .naming{font-size:11px;line-height:1.65;color:var(--ink-faint);margin-top:auto}
  #inspectClose{
    position:absolute;top:16px;right:30px;width:32px;height:32px;
    border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:17px;line-height:1;color:var(--ink-soft);transition:.25s;
  }
  #inspectClose:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* while a record is open the caption would sit under the specimen */
  /* With a record open the panel already carries the name, so the label over
     the specimen stands down. The year behind it stays — nothing else shows it. */
  body.inspecting #caption,body.inspecting .hint{opacity:0!important;pointer-events:none}
  .hint{transition:opacity .4s ease}

  /* ---------- changing views: the specimens rearrange ---------- */
  #shuffle{position:fixed;inset:0;z-index:52;pointer-events:none;overflow:hidden}
  #shuffle img{
    position:absolute;display:block;max-width:none;object-fit:contain;
    transform-origin:50% 50%;will-change:transform,opacity;
  }
  /* On the way out the row is handed over to the flying copies, so the canvas
     steps aside. On the way back it must stay: the copies are meant to
     dissolve into the models they land on, and they cannot dissolve into an
     empty sea. */
  body.shuffling.to-grid #stage{opacity:0}
  #stage{transition:opacity .18s ease}
  /* The cell and the copy that lands on it are the same picture in the same
     place, so the swap is instant — a fade here would show a gap between the
     copy being removed and the cell coming back. */
  body.shuffling .plate img{opacity:0}

  /* ---------- about ---------- */
  #about{
    position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
    padding:30px;background:rgba(26,30,31,.45);opacity:0;pointer-events:none;transition:opacity .4s;
  }
  #about.on{opacity:1;pointer-events:auto}
  #about .box{
    max-width:640px;max-height:calc(100vh - 60px);overflow-y:auto;overscroll-behavior:contain;
    border:1px solid rgba(26,30,31,.15);
    background:var(--paper-soft);padding:38px 40px;color:#1a1e1f;
  }
  #about .box::-webkit-scrollbar{width:7px}
  #about .box::-webkit-scrollbar-thumb{background:rgba(26,30,31,.2)}
  #about h3{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.005em;margin-bottom:16px}
  #about h4{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.01em;
    margin:26px 0 10px;padding-top:18px;border-top:1px solid rgba(26,30,31,.15)}
  #about strong{font-weight:600}
  #about .lead{font-weight:600;color:#1a1e1f}
  #about .step{margin-bottom:12px}
  #about .step b{display:block;font-weight:600;color:#1a1e1f}
  #about .step span{display:block;margin-top:3px}
  #about .credit{margin-top:22px;color:rgba(26,30,31,.38);font-size:12px}
  /* Wer das gebaut hat, am Ende und abgesetzt: eine Linie darüber, damit es
     als Signatur liest und nicht als ein weiterer Absatz. */
  #about .sign{
    margin-top:34px;padding-top:20px;border-top:1px solid rgba(26,30,31,.12);
    display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  }
  #about .sign .who{
    font-family:var(--display);font-size:15px;letter-spacing:.02em;
    color:#1a1e1f;margin:0;
  }
  #about .sign .rolle{font-size:12.5px;color:rgba(26,30,31,.48);margin:0 0 8px}
  #about .sign a{
    display:inline-flex;align-items:baseline;gap:8px;
    font-size:12.5px;color:rgba(26,30,31,.58);text-decoration:none;
    padding:3px 0;box-shadow:inset 0 -1px 0 rgba(26,30,31,.16);
    transition:color .2s,box-shadow .2s;
  }
  #about .sign a:hover{color:#1a1e1f;box-shadow:inset 0 -1px 0 #1a1e1f}
  #about .sign a .wo{
    font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(26,30,31,.34);flex:none;width:78px;
  }
  #about em{font-style:italic}
  #about p{font-size:13.5px;line-height:1.8;color:rgba(26,30,31,.58);margin-bottom:14px}
  /* The three photographs stand together behind the paragraph that describes
     the stations. Side by side rather than stacked: full width they would be
     a thousand pixels of scrolling in the middle of a text. One ratio across
     all three, because the snapshots are portrait and landscape and left at
     their own proportions they read as an accident rather than as a series.
     The strip counts its own columns — the panel is 640px wide at most
     whatever the window does — so on a phone it becomes one column. */
  #about .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;margin:2px 0 18px}
  #about .shots[hidden]{display:none}
  #about .shots figure{margin:0}
  #about .shots img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;
    border:1px solid rgba(26,30,31,.15);background:rgba(26,30,31,.05)}
  #about .shots figcaption{margin-top:6px;font-size:11px;line-height:1.5;color:rgba(26,30,31,.38)}
  /* The panel became a project text rather than a note, and the button at its
     foot is now three thousand pixels down. On a phone there is no Escape key
     to fall back on, so a second way out rides along at the top. */
  #about .box{position:relative}
  #about .closeX{
    position:sticky;top:0;float:right;margin:-16px -28px 0 12px;
    width:32px;height:32px;border:1px solid rgba(26,30,31,.15);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;
    color:rgba(26,30,31,.58);background:var(--paper-soft);transition:.25s;z-index:2;
  }
  #about .closeX:hover{background:#1a1e1f;color:var(--paper);border-color:#1a1e1f}
  #about .close2{margin-top:14px;border:1px solid rgba(26,30,31,.15);padding:11px 22px;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(26,30,31,.58);transition:.25s}
  #about .close2:hover{background:#1a1e1f;color:var(--paper)}

  /* ---------- loader ---------- */
  #boot{
    position:fixed;inset:0;z-index:200;background:var(--paper);display:flex;
    align-items:center;justify-content:center;flex-direction:column;gap:20px;transition:opacity .7s;
  }
  #boot.gone{opacity:0;pointer-events:none}
  /* ---------- the mark ----------
     The artwork is 571 paths; inlining it twice would put a quarter of a
     megabyte into this file. It stays a separate cacheable SVG and is drawn as
     a CSS mask instead, which also means one rule decides its colour — the
     drawing has no fills of its own.

     Boot screen and intro place it from the viewport centre at the same width,
     so when the boot screen fades it uncovers the intro logo in exactly the
     same spot: a cross-fade rather than a jump. */
  .marke{
    display:block;width:var(--logo-w);aspect-ratio:1137.51 / 329.38;
    -webkit-mask:var(--marke) no-repeat center/contain;
            mask:var(--marke) no-repeat center/contain;
    background:#1a1e1f;
  }
  /* The loading bar is the logo itself: a hard-edged gradient rises through the
     mask. Registering the property is what lets it animate at all — a plain
     custom property would jump from step to step. */
  @property --fuell{syntax:"<percentage>";inherits:false;initial-value:0%}
  #bootMarke{
    background:linear-gradient(to top,
      #1a1e1f 0 var(--fuell), rgba(26,30,31,.15) var(--fuell) 100%);
    transition:--fuell .5s cubic-bezier(.3,.7,.3,1);
  }
  #boot .marke{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  /* In the archive the mark sits in the middle of the header, above everything.
     It takes var(--ink) rather than a literal white so it survives the two
     places the ground turns to paper — drawing mode and the overview. */
  .marke-archiv{
    position:absolute;left:50%;top:22px;transform:translateX(-50%);
    width:clamp(112px,13vw,178px);background:var(--ink);pointer-events:none;
    transition:background .9s ease, left .62s cubic-bezier(.3,.8,.25,1);
  }
  /* With the record open the mark centres in what is left of the header, so it
     never runs under the panel — the same edge the toolbar groups step back to. */
  body.inspecting .marke-archiv{left:calc(50% - (var(--panel-w) + 34px) / 2)}
  /* the words the mark stands for, for anything that cannot see it */
  .nurVorleser{
    position:absolute;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;
  }

  /* short windows: the label would otherwise run into the header */
  @media(max-height:620px){
    #caption{bottom:96px;max-width:280px}
    #caption .yr{font-size:22px}
    #caption .sci{font-size:1rem;margin-top:6px}
    #caption .env,#caption .who{margin-top:6px}
    .hint{display:none}
  }
  @media(max-width:900px){
    /* The header cannot hold these controls. Their labels alone want 362px of
       a 375px screen, and shrinking them to fit made them unreadable and too
       small to hit. So the header keeps only what is needed at a glance — the
       mark, and info — and everything that switches something moves into a
       menu that the header itself unfolds into. No second panel: the bar
       grows, the scene stays where it is. */
    .topbar{
      display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
      padding:14px 18px;column-gap:10px;row-gap:0;
    }
    .marke-archiv{
      display:block;position:static;transform:none;
      width:128px;grid-column:2;grid-row:1;
    }
    .topbar .tools{display:contents}
    #aboutBtn{
      grid-column:1;grid-row:1;justify-self:start;
      width:32px;height:32px;font-size:16px;
    }
    #menuBtn{
      display:flex;flex-direction:column;justify-content:center;align-items:flex-end;
      gap:4px;width:34px;height:34px;grid-column:3;grid-row:1;justify-self:end;
      pointer-events:auto;
    }
    #menuBtn i{display:block;height:1.5px;width:22px;background:var(--ink);border-radius:1px;
      transition:transform .3s cubic-bezier(.3,.8,.25,1),opacity .2s,width .3s}
    #menuBtn i:nth-child(2){width:16px}
    body.menu-open #menuBtn i:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
    body.menu-open #menuBtn i:nth-child(2){opacity:0;width:0}
    body.menu-open #menuBtn i:nth-child(3){width:22px;transform:translateY(-5.5px) rotate(-45deg)}

    /* Closed, the switches are simply not there. */
    .topbar .toggle{display:none}
    body.menu-open .topbar{
      background:var(--chip);backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-bottom:1px solid var(--line);padding-bottom:14px;row-gap:8px;
    }
    /* the mark wants distance from the first switch, or the card reads as one
       dense block with a logo stuck on top of it */
    body.menu-open .marke-archiv{margin-bottom:6px}
    /* Segmented switches rather than pairs of words: on a touch screen the
       choice should look like a control and the current state should be
       obvious without reading carefully. Each takes a full row — side by side
       they overflow even 375px, and a menu has the height to spare. */
    body.menu-open .topbar .toggle{
      display:flex;gap:0;grid-column:1 / -1;
      border:1px solid var(--line);border-radius:999px;overflow:hidden;
    }
    body.menu-open .topbar .tools:nth-of-type(1) .toggle:first-child{grid-row:2}
    body.menu-open .topbar .tools:nth-of-type(1) .toggle:last-child{grid-row:3}
    body.menu-open #langSwitch{grid-row:4}
    body.menu-open .topbar .toggle button{
      flex:1;padding:10px 4px;font-size:11px;letter-spacing:.08em;
      border-radius:0;box-shadow:none;color:var(--ink-soft);
    }
    /* --paper does not flip with the dark grade, so on the sea the active half
       was light ink on a light field and the label vanished. The counterpart
       has to be named for each ground. */
    body.menu-open .topbar .toggle button.on{
      background:var(--ink);color:var(--paper);box-shadow:none;
    }
    body.on-dark.menu-open .topbar .toggle button.on{color:#14232a}
    /* ...but over the plate wall the ink is dark again, so the counterpart is
       the paper once more — otherwise the active half is dark on dark. */
    body.on-dark.gridding.menu-open .topbar .toggle button.on{color:var(--paper)}
    /* The marker carries a year of its own, and in the middle of the axis it
       sits directly under the centred species name — 49px apart, less once a
       phone's own bars have taken their share. The axis drops toward the edge
       and the name rises a little toward its coral; between them that is about
       thirty pixels of air won back. */
    #timeline{left:20px;right:20px;bottom:16px}
    .hint{display:none}
    /* The binomial plus a variety runs to 395px at the desktop grade, and the
       screen is 375 — fifteen of the sixty-seven did not fit. Down a step, and
       with the tracking eased, the longest lands near 340. */
    #caption .sci{font-size:14px;letter-spacing:.03em}
    /* no room to stand the specimen beside its record: the panel takes the
       lower half of the screen and the coral keeps the upper */
    #inspect{top:auto;left:0;width:auto;height:54vh;padding:22px 20px 24px;
      border-left:none;border-top:1px solid var(--line);
      transform:translateY(102%);gap:14px}
    body.inspecting .topbar{padding-right:20px}
    .plates{margin-top:132px}      /* the toolbar stacks into two rows here */
    #inspect .source figure{width:84px}
    #inspect .kicker{padding-right:44px}      /* clear of the close button */
    #inspect #inspectMap{max-width:340px}
    #inspectClose{top:14px;right:18px}
    /* Forty pixels of padding either side of a 375px screen left the project
       text 235px wide — about four words to the line. */
    #about{padding:14px}
    #about .box{padding:26px 22px;max-height:calc(100vh - 28px)}
    #about .closeX{margin:-12px -12px 0 10px}
    #about h3{font-size:22px}
  }
  @media(prefers-reduced-motion:reduce){
    .mtrack{animation-play-state:paused!important}
    #intro,.mrows,.mcentre,.mscrim{transition-duration:.2s!important}
  }
</style>

{

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
// BUMP THE MARKER WHENEVER ONE OF THESE MODULES CHANGES. Forgetting it is
// silent: the browser keeps serving the cached copy, the edit simply never
// arrives, and the page behaves as though the change was never made.
// The version marker defeats the browser's module cache, which otherwise
// serves yesterday's copy of an edited module for hours. Bump it when either
// file changes; it can go once the no-cache dev server is what serves this.
import { Environment, deepenWater } from './js/environment.js?v=10';
import { worldMapSVG, seaLabel } from './js/worldmap.js?v=10';

/* ============================================================
   Layout constants
   ============================================================ */
const SPACING   = 5.6;
/* One camera carries both the models and the drawings, so its distance is the
   single place their size is decided. A phone stands closer to the eye and its
   frame is narrow: at the desktop distance the specimen filled well over half
   the height. Further back it takes about half, and the sea around it comes
   back into view. */
const CAM_DIST_WEIT = 7.8;
let CAM_DIST = CAM_DIST_WEIT;
function passeAbstandAn(){
  CAM_DIST = innerWidth <= 900 ? 9.5 : CAM_DIST_WEIT;
  messeBand();
}

/* The strip a phone has left for the specimen once the record is open: below
   the header, above the sheet.

   Both edges are measured rather than computed. The sheet is 54vh tall, and on
   a phone a vh is not a hundredth of innerHeight — the address bar counts
   against innerHeight and not against vh — so the sheet is taller than the
   arithmetic says and its top edge sits higher. Deriving it put the coral's
   foot behind the panel on exactly the devices this is for. */
let bandOben = 96, bandUnten = 360;
function messeBand(){
  const kopf  = document.querySelector('.topbar');
  const blatt = document.getElementById('inspect');
  bandOben  = (kopf ? kopf.getBoundingClientRect().bottom : 65) + 30;
  const hoch = blatt ? blatt.getBoundingClientRect().height : innerHeight * 0.54;
  bandUnten = innerHeight - hoch - 14;
}
passeAbstandAn();
const CAM_HIGH  = 1.62;
/* The intro does not cut to the archive, it arrives at it: the camera starts
   above and behind its resting place, in the pale light near the surface, and
   sinks onto the specimen while the sea closes over it. Both offsets ride on
   top of whatever placeCamera() works out, so the row, the record and the
   phone's tilt all keep working untouched — at rest they are simply zero. */
let anflugHoch = 0, anflugWeit = 0;
const FIT       = 3.5;
// The sheet has margins the model does not, so matching the two by their
// outlines would print a much smaller coral. It is sized instead so that the
// drawn coral lands at about the height of the model, and switching between
// them is a change of medium rather than a jump in scale.
const DRAW_FIT  = 4.3;
const LOAD_NEAR = 2;
const KEEP_NEAR = 4;

// filmed backdrop used when a scenario does not name its own clip;
// set to null to fall back to the plain gradient everywhere
// the photoreal plates inside the 3D scene carry the backgrounds now;
// set this to a clip path to lay filmed footage over them instead
const DEFAULT_ENV_VIDEO = null;

const stage = document.getElementById('stage');
const backdrop = document.getElementById('backdrop');
const bootMarke = document.getElementById('bootMarke');
/* 0 keeps the mark empty, 1 fills it to the top. */
function bootProgress(p){
  bootMarke.style.setProperty('--fuell', `${Math.max(0, Math.min(1, p)) * 100}%`);
}
const bootTxt = document.getElementById('bootTxt');

/* ============================================================
   Renderer — transparent, so the CSS environment shows through
   ============================================================ */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearAlpha(0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);

// lighting, seabed, drift and props all come from the scenario sets
let env = null;

const texLoader = new THREE.TextureLoader();
const gltfLoader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);

function shadowTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,2,64,64,62);
  g.addColorStop(0,'rgba(18,24,28,0.34)');
  g.addColorStop(0.55,'rgba(18,24,28,0.1)');
  g.addColorStop(1,'rgba(18,24,28,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;

const shadowTex = shadowTexture();

/* ============================================================
   Environment
   ============================================================ */
function luminance(hex){
  const c = new THREE.Color(hex);
  return 0.2126*c.r + 0.7152*c.g + 0.0722*c.b;
}

/* One filmed deep-sea plate can back every specimen: the per-scenario gradient
   multiplies over it, so the same footage reads as clear water or as a murky
   plastic soup. `video` in a scenario's set names a different clip. */
const videoEl = document.getElementById('envvideo');
let videoSrc = null;
let shownEnvSpec = null;          // so a mode change can repaint without a move
const PAPER = '#f4f2ee', PAPER_EDGE = '#e6e2da';

function applyVideo(set){
  const src = set.video === undefined ? DEFAULT_ENV_VIDEO : set.video;
  if(src === videoSrc) return;
  videoSrc = src;
  if(!src){
    videoEl.classList.remove('on');
    backdrop.classList.remove('over-video');
    return;
  }
  if(videoEl.getAttribute('src') !== src){
    videoEl.setAttribute('src', src);
    videoEl.play().catch(() => {});   // autoplay is fine: muted + playsinline
  }
  videoEl.classList.add('on');
  backdrop.classList.add('over-video');
}

function applyEnvironment(spec){
  if(!spec) return;
  shownEnvSpec = spec;
  const sc = spec.scenario || {};
  const set = sc.set || {};

  // Drawing mode shows the sheets and nothing around them: no water column,
  // no horizon, no glare. The page becomes the paper they were drawn on, and
  // the interface goes back to ink — a white timeline over white paper would
  // not be there at all.
  if(mode === 'draw'){
    applyVideo({video: null});
    backdrop.style.setProperty('--bg-top', PAPER);
    backdrop.style.setProperty('--bg-bottom', PAPER_EDGE);
    backdrop.style.setProperty('--glare', '0');
    document.body.classList.remove('on-dark');
    return;
  }

  applyVideo(set);
  // The page background is the water column above the seabed: lighter at the
  // top, fading into exactly the colour the 3D fog uses, so the two meet
  // without a seam at the horizon. Both ends run through the same depth grade
  // the scene applies to its fog — otherwise the column would sit in daylight
  // above a scene that is a thousand metres down. The top keeps a little more
  // of its colour, which is all that is left of the surface.
  const top = deepenWater((sc.palette && sc.palette[0]) || '#f4f2ee', 0.62);
  const bottom = deepenWater(set.fog || (sc.palette && sc.palette[1]) || '#f4f2ee');
  backdrop.style.setProperty('--bg-top', top);
  backdrop.style.setProperty('--bg-bottom', bottom);

  const lum = luminance(top) * 0.4 + luminance(bottom) * 0.6;
  backdrop.style.setProperty('--glare', String(Math.min(0.75, 0.15 + lum * 0.7)));
  document.body.classList.toggle('on-dark', lum < 0.42);
}

/* ============================================================
   Specimens
   ============================================================ */
let DATA = null, META = null;
const slots = [];
const pickTargets = [];
let mode = '3d';
let minYear = 2026, maxYear = 2200;

function yearOf(spec){ return (spec.scenario && spec.scenario.year) || minYear; }
function sciName(spec){ return spec.variety ? `${META.baseSpecies} ${spec.variety}` : META.baseSpecies; }
function envTitle(spec){ return (spec.scenario && spec.scenario.title) || ''; }

function makeSlot(spec, index){
  const group = new THREE.Group();
  group.position.x = index * SPACING;
  scene.add(group);

  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(3.0, 3.0),
    new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, opacity:0.8, depthWrite:false})
  );
  shadow.rotation.x = -Math.PI/2;
  shadow.position.y = 0.002;
  shadow.scale.set(1, 0.55, 1);
  group.add(shadow);

  const board = new THREE.Mesh(
    new THREE.PlaneGeometry(FIT, FIT),
    new THREE.MeshBasicMaterial({transparent:true, opacity:0, toneMapped:false,
      side:THREE.DoubleSide, depthWrite:false})
  );
  board.position.y = FIT/2 + 0.05;
  group.add(board);

  const hit = new THREE.Mesh(
    new THREE.CylinderGeometry(1.5, 1.5, FIT + 0.4, 8),
    new THREE.MeshBasicMaterial({visible:false})
  );
  hit.position.y = (FIT + 0.4)/2;
  group.add(hit);

  const slot = {spec, index, group, board, shadow, hit,
                model:null, loading:false, spin:0, baseYaw:0,
                thumbTex:null, drawTex:null, drawRatio:0, thumbRatio:0};
  hit.userData.slot = slot;
  pickTargets.push(hit);
  slots.push(slot);
  return slot;
}

function loadModel(slot){
  // `missing` stops a specimen without a model from being requested on every
  // streaming pass; it falls back to its render instead
  if(slot.model || slot.loading || slot.missing) return;
  slot.loading = true;
  gltfLoader.load(`assets/models/${slot.spec.id}.glb`, (gltf) => {
    slot.loading = false;
    const model = gltf.scene;
    model.traverse(o => { if(o.isMesh) o.frustumCulled = false; });

    // Align every specimen the same way: lay the widest horizontal axis across
    // the view, then turn the drawn side — not the back — toward the camera.
    const probe = new THREE.Box3().setFromObject(model);
    const extent = new THREE.Vector3(); probe.getSize(extent);
    slot.baseYaw = typeof slot.spec.rotationY === 'number'
      ? slot.spec.rotationY
      : (extent.z > extent.x ? -Math.PI/2 : Math.PI);
    model.rotation.y = slot.baseYaw + slot.spin;

    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3(); box.getSize(size);
    model.scale.setScalar(FIT / Math.max(size.x, size.y, size.z));
    const box2 = new THREE.Box3().setFromObject(model);
    const centre = new THREE.Vector3(); box2.getCenter(centre);
    model.position.set(-centre.x, -box2.min.y, -centre.z);

    model.visible = (mode === '3d');
    slot.group.add(model);
    slot.model = model;
    refreshBoard(slot);
  }, undefined, () => {
    slot.loading = false;
    slot.missing = true;
    refreshBoard(slot);   // show the render at full strength instead
  });
}

function disposeModel(slot){
  if(!slot.model) return;
  slot.group.remove(slot.model);
  slot.model.traverse(o => {
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { for(const k in m){ const v = m[k]; if(v && v.isTexture) v.dispose(); } m.dispose(); });
    }
  });
  slot.model = null;
  refreshBoard(slot);
}

function ensureTexture(slot, which){
  const key = which === 'draw' ? 'drawTex' : 'thumbTex';
  const ratioKey = which === 'draw' ? 'drawRatio' : 'thumbRatio';
  if(slot[key]) return slot[key];
  const url = (which === 'draw' && !slot.spec.reference)
    ? `assets/img/drawing/${slot.spec.id}.webp`   // the reference has no sheet
    : `assets/img/thumb/${slot.spec.id}.webp`;
  const tex = texLoader.load(url, (t) => {
    t.colorSpace = THREE.SRGBColorSpace;
    slot[ratioKey] = t.image.width / t.image.height;
    refreshBoard(slot);
  });
  tex.colorSpace = THREE.SRGBColorSpace;
  slot[key] = tex;
  return tex;
}

function refreshBoard(slot){
  const material = slot.board.material;
  const drawing = (mode === 'draw');
  const showBoard = drawing || !slot.model;
  if(showBoard){
    material.map = ensureTexture(slot, drawing ? 'draw' : 'thumb');
    // a faint placeholder while a model loads; solid when there is no model
    material.opacity = (drawing || slot.missing) ? 1 : 0.42;
    // Every sheet was photographed at its own proportions, and none of them
    // match the render. Sharing one ratio between the two textures let
    // whichever loaded last decide the shape, which stretched the drawings —
    // so each carries its own, and the board waits until it has the right one
    // rather than showing the sheet squared off.
    const r = drawing ? slot.drawRatio : slot.thumbRatio;
    if(r){
      const k = drawing ? DRAW_FIT / FIT : 1;
      const sx = (r > 1 ? 1 : r) * k, sy = (r > 1 ? 1/r : 1) * k;
      slot.board.scale.set(sx, sy, 1);
      // A model stands on the seabed; a sheet has nothing to stand on, and in
      // drawing mode there is no seabed anyway. It hangs centred in the frame
      // instead, at the height the camera is already looking at.
      slot.board.position.y = drawing ? CAM_HIGH : FIT/2 + 0.05;
    }
    slot.board.visible = !!r;
  } else {
    slot.board.visible = false;
  }
  slot.shadow.visible = !drawing;
  if(slot.model) slot.model.visible = (mode === '3d');
  material.needsUpdate = true;
}

function setMode(next){
  if(mode === next) return;
  mode = next;
  document.getElementById('mode3d').classList.toggle('on', mode === '3d');
  document.getElementById('modeDraw').classList.toggle('on', mode === 'draw');
  document.getElementById('hint').textContent =
    t(mode === 'draw' ? 'hintDraw' : 'hint3d');
  slots.forEach(refreshBoard);
  refreshPlates();
  if(env) env.setSubmerged(mode === '3d');
  applyEnvironment(shownEnvSpec);   // the page behind them changes with them
  if(mode === '3d') updateStreaming();
}

function updateStreaming(){
  slots.forEach(slot => {
    const d = Math.abs(slot.index - current);
    if(mode === '3d' && d <= LOAD_NEAR) loadModel(slot);
    else if(d > KEEP_NEAR) disposeModel(slot);
    // the surrounding set reaches a little further than the models
    if(env){
      if(d <= LOAD_NEAR + 1) env.ensureProps(slot.index);
      else if(d > KEEP_NEAR + 1) env.releaseProps(slot.index);
    }
  });
}

/* ============================================================
   Travel + rotation
   ============================================================ */
let target = 0, current = 0, maxIndex = 0;
let inputLocked = true;

/* With the project text open it is the only thing that scrolls. The archive
   browses on wheel events collected at the window and the overview behind the
   panel is a real scroll container, so both would otherwise move under a
   reader who is only scrolling the text. */
const liestProjekt = () => document.body.classList.contains('about-open');

function clampTarget(){ target = Math.max(0, Math.min(maxIndex, target)); }

addEventListener('wheel', (e) => {
  if(gridOpen || inputLocked || introOpen || liestProjekt()) return;
  const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  target += delta * 0.0026;
  clampTarget();
  hideHint();
}, {passive:true});

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-10,-10);
let dragging = false, rotatingSlot = null, pressedSlot = null;
let dragX = 0, dragStart = 0, moved = 0, spinStart = 0;
const CLICK_SLOP = 6;              // px of travel still counted as a click

function slotUnderPointer(e){
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickTargets, false);
  return hits.length ? hits[0].object.userData.slot : null;
}

/* A finger is not a mouse. On a phone the specimen fills the middle of the
   screen, so nearly every swipe starts on it — and turning the coral would
   then swallow almost every attempt to browse. Dragging therefore always
   browses on a touch screen; turning stays a mouse gesture, and the record
   puts the specimen on a turntable anyway. */
let zugX = 0, zugZeit = 0, wucht = 0;

/* Turning on a touch screen needs a gesture of its own. One finger has to stay
   with browsing — on a phone the specimen fills the middle, so a drag that
   started on it would otherwise almost always turn instead of move. Two
   fingers turn: unambiguous, and nothing else in the archive claims them. */
const zeiger = new Map();          // pointerId -> clientX
let zweiFinger = false, zweiStart = 0, zweiSpin = 0, zweiSlot = null;

function mitteDerZeiger(){
  let summe = 0;
  for(const x of zeiger.values()) summe += x;
  return summe / zeiger.size;
}
function beendeZweiFinger(){
  zweiFinger = false; zweiSlot = null;
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  if(gridOpen || inputLocked || introOpen) return;
  const slot = slotUnderPointer(e);
  dragging = true; dragX = e.clientX; moved = 0;
  zugX = e.clientX; zugZeit = e.timeStamp; wucht = 0;
  pressedSlot = slot;
  zeiger.set(e.pointerId, e.clientX);
  if(zeiger.size === 2 && mode === '3d'){
    // the specimen the archive is standing at, not whatever a finger landed on
    const mitte = slots[Math.max(0, Math.min(maxIndex, Math.round(current)))];
    if(mitte && mitte.model){
      zweiFinger = true; zweiSlot = mitte;
      zweiStart = mitteDerZeiger(); zweiSpin = mitte.spin;
      target = dragStart;              // give up the browse the first finger began
      clampTarget();
    }
  }
  // The event says what it was, and that is more reliable than asking the
  // media query: a laptop with a touchscreen reports a coarse pointer even
  // while its owner is using the mouse, and would lose turning for no reason.
  const dreht = mode === '3d' && slot && slot.model && e.pointerType !== 'touch';
  if(dreht){
    rotatingSlot = slot; spinStart = slot.spin;
  } else {
    rotatingSlot = null; dragStart = target;
  }
  // keep the stream even when the finger leaves the canvas mid-swipe
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch {}
  renderer.domElement.style.cursor = rotatingSlot ? 'grabbing' : 'ew-resize';
});

addEventListener('pointermove', (e) => {
  if(!dragging){
    if(!gridOpen){
      const slot = slotUnderPointer(e);
      renderer.domElement.style.cursor = (slot && (mode !== '3d' || slot.model)) ? 'pointer' : '';
    }
    return;
  }
  if(zeiger.has(e.pointerId)) zeiger.set(e.pointerId, e.clientX);
  if(zweiFinger && zweiSlot){
    const spin = zweiSpin + (mitteDerZeiger() - zweiStart) * 0.014;
    zweiSlot.spin = spin;
    if(zweiSlot.model) zweiSlot.model.rotation.y = zweiSlot.baseYaw + spin;
    moved = CLICK_SLOP + 1;            // a turn is never a tap
    hideHint();
    return;
  }
  const dx = e.clientX - dragX;
  moved = Math.max(moved, Math.abs(dx));
  if(rotatingSlot){
    rotatingSlot.spin = spinStart + dx * 0.011;
    if(rotatingSlot.model) rotatingSlot.model.rotation.y = rotatingSlot.baseYaw + rotatingSlot.spin;
  } else {
    target = dragStart - dx * 0.0055;
    clampTarget();
    // running velocity, for the flick below
    const dt = e.timeStamp - zugZeit;
    if(dt > 0){ wucht = (e.clientX - zugX) / dt; zugX = e.clientX; zugZeit = e.timeStamp; }
  }
  if(moved > 6) hideHint();
});

function zeigerWeg(e){
  if(e && zeiger.has(e.pointerId)) zeiger.delete(e.pointerId);
  if(zeiger.size < 2) beendeZweiFinger();
}
addEventListener('pointercancel', (e) => { zeigerWeg(e); dragging = false; });

addEventListener('pointerup', (e) => {
  zeigerWeg(e);
  if(dragging && zweiFinger){ dragging = false; rotatingSlot = null; pressedSlot = null; return; }
  if(dragging && !rotatingSlot){
    // Without this a quick flick moves half a specimen and snaps back, which
    // is what makes browsing feel stuck on a phone: the throw carries on for
    // as far as the speed of the gesture warrants, up to three specimens.
    const schwung = Math.max(-3, Math.min(3, -wucht * 1.1));
    target = Math.round(target + schwung);
    clampTarget();
  }
  // A press that did not travel is a click. On a specimen it opens that
  // specimen's record; on open water it puts the record away again.
  if(dragging && moved <= CLICK_SLOP){
    if(pressedSlot) openInspect(pressedSlot.index);
    else if(inspectOpen) closeInspect();
  }
  dragging = false; rotatingSlot = null; pressedSlot = null;
  renderer.domElement.style.cursor = '';
});

addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){ setMenu(false); closeAbout(); closeInspect(); if(gridOpen) setView('line'); }
  // Escape above still closes the panel; the arrows below must not walk the
  // archive along underneath somebody who is reading
  if(gridOpen || introOpen || liestProjekt()) return;
  // with a record open the arrows walk it along, so the panel follows the
  // specimen instead of being left behind on the wrong one
  if(e.key === 'ArrowRight'){
    const next = Math.round(target) + 1;
    if(inspectOpen) openInspect(Math.min(maxIndex, next));
    else { target = next; clampTarget(); hideHint(); }
  }
  if(e.key === 'ArrowLeft'){
    const prev = Math.round(target) - 1;
    if(inspectOpen) openInspect(Math.max(0, prev));
    else { target = prev; clampTarget(); hideHint(); }
  }
});

function hideHint(){ document.getElementById('hint').classList.add('gone'); }

/* ============================================================
   Intro — the unchanged coral, then a scroll into the timeline
   ============================================================ */
const introEl = document.getElementById('intro');
let introOpen = true;
document.body.classList.add('introing');

/* Every specimen drifts across the intro in alternating rows. Each track holds
   its images twice so the marquee can loop without a visible seam. */
function buildIntroGrid(){
  const rows = 5;
  const buckets = Array.from({length: rows}, () => []);
  DATA.forEach((spec, i) => buckets[i % rows].push(spec));

  document.getElementById('mrows').innerHTML = buckets.map((bucket, r) => {
    const imgs = bucket.concat(bucket).map((spec, i) =>
      `<img loading="${i < bucket.length ? 'eager' : 'lazy'}" decoding="async"
            data-specimen="${spec.id}" data-copy="${i < bucket.length ? 0 : 1}"
            src="assets/img/render/${spec.id}.webp" alt="" aria-hidden="true">`).join('');
    const dir = r % 2 === 0 ? 'l' : 'r';
    /* Seconds for the whole loop, counted per specimen rather than per row.
       A row slides one image-width every seven seconds whatever the archive
       holds — at a fixed duration the drift got faster with every drawing
       added, and at a hundred and forty-seven it was racing. The offset per
       row keeps the five from marching in step. */
    const dur = Math.round(bucket.length * 7 + r * 10);
    return `<div class="mrow" data-dir="${dir}" style="--dur:${dur}s"><div class="mtrack">${imgs}</div></div>`;
  }).join('');
}

const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

/* ---- the thanks, between the drifting field and the archive ----
   Marks of the institutions that carried the project. They are named here
   rather than in the locale files: a mark is the same in every language. Add
   an entry per institution — the file goes in assets/img/dank/, the name is
   the alt text a screen reader and a missing file both fall back to.
   A file that will not load drops out; when none load the board still runs,
   with the sentence that does not need a list after it. */
const DANK_LOGOS = [
  // {src: 'assets/img/dank/name.svg', name: 'Name der Einrichtung'},
];
const dankEl = document.getElementById('dank');
const autorEl = document.getElementById('autor');

/* Load them once, up front: the board has to know before it opens whether it
   is introducing a row of marks or standing on its own. */
const dankBereit = Promise.all(DANK_LOGOS.map(logo => new Promise(fertig => {
  const bild = new Image();
  bild.onload = () => fertig(logo);
  bild.onerror = () => fertig(null);
  bild.src = logo.src;
}))).then(liste => liste.filter(Boolean));

async function zeigeDank(ohneBewegung){
  const marken = await dankBereit;
  document.getElementById('autorText').textContent = t('byline');
  document.getElementById('dankText').textContent =
    t(marken.length ? 'thanks' : 'thanksAlone');
  document.getElementById('dankLogos').innerHTML = marken
    .map(m => `<img src="${m.src}" alt="${m.name}">`).join('');

  // A visitor who has read it once should not have to read it again: any
  // gesture cuts to the archive.
  let ueberspringen;
  const abbruch = new Promise(r => { ueberspringen = r; });
  // ...but not with the flick that entered: a trackpad's momentum keeps firing
  // wheel events for a while after the gesture that opened the archive.
  const seit = performance.now();
  const merker = () => { if(performance.now() - seit > 800) ueberspringen(); };
  addEventListener('pointerdown', merker);
  addEventListener('keydown', merker);
  addEventListener('wheel', merker, {passive: true});
  const takt = ohneBewegung ? 0.5 : 1;
  const pause = (ms) => Promise.race([wait(ms * takt), abbruch]);

  introEl.classList.add('raeumt');   // rows out to the sides, mark and veil away
  await pause(420);                  // they are well on their way before it reads
  dankEl.classList.add('on');
  await pause(2900);                 // fade in, then long enough to read
  dankEl.classList.remove('on');
  await pause(700);                  // gone before the next line takes its place

  autorEl.classList.add('on');
  await pause(2000);
  /* The signature is left fading rather than waited out: the paper lifts under
     it and the descent is already running by the time the last of it is gone. */
  autorEl.classList.remove('on');
  await pause(140);

  removeEventListener('pointerdown', merker);
  removeEventListener('keydown', merker);
  removeEventListener('wheel', merker);
  dankEl.classList.remove('on');     // a skip may have cut either fade short
  autorEl.classList.remove('on');
}
const nextPaint = () => new Promise(resolve =>
  requestAnimationFrame(() => requestAnimationFrame(resolve)));
let introLeaving = false;

async function leaveIntro(){
  if(!introOpen || introLeaving) return;
  introLeaving = true;
  target = current = 0;            // the archive opens on the reference specimen

  /* Whether the visitor gets the whole descent or only the water clearing.
     A phone in low-power mode reports reduced motion too, so this must not be
     a cut to the archive — it is the same arrival, without the camera move. */
  const sanft = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* The specimen the archive opens on is the template itself — the coral as it
     stands today, with nothing added to it. Fetching it is started here rather
     than after the thanks, so it has the whole board to arrive in and the
     handoff does not have to wait for the network. */
  const opener = slots[0];
  const bereit = (async () => {
    for(let i = 0; i < 60 && !opener.model; i++){
      loadModel(opener);
      await wait(100);
    }
  })();

  await zeigeDank(sanft);
  introEl.classList.add('assembling');
  await bereit;

  /* Set the dive up while the paper still covers it. The sea is not taken
     away and brought back — it is there the whole time; the camera simply
     starts high up in it, where the light is still daylight and there is so
     much water in the way that nothing below is visible yet. */
  if(env){ env.setSubmerged(true); env.setDive(1); }
  anflugHoch = sanft ? 0 : 11.4;
  anflugWeit = sanft ? 0 : (innerWidth <= 900 ? 3.6 : 2.8);
  backdrop.style.transition = 'none';
  backdrop.style.opacity = '1';
  backdrop.style.filter = 'brightness(1.9) saturate(.62)';
  await nextPaint();

  /* The paper lifts onto bright, blank water — no cut, and nothing to see in
     it yet but the light coming down from above. */
  introEl.classList.add('handoff');
  introEl.classList.add('gone');
  await wait(sanft ? 240 : 420);
  introEl.style.display = 'none';
  introEl.setAttribute('aria-hidden', 'true');
  introOpen = false;

  // and then it sinks: the drift streams up past the lens, the water goes out
  // of the light and into the blue, and the seabed comes up out of the murk
  await tauchgang(sanft ? 1500 : 3600);

  backdrop.style.transition = '';
  backdrop.style.filter = '';
  document.body.classList.remove('introing');
}

/* The descent. One frame loop drives all three things that make it read as
   depth rather than as a move: the camera falls, the water clears, and the
   page's own gradient loses its daylight. They are deliberately not on the
   same curve — the camera pushes off and coasts down, while the water holds
   its murk a moment longer and only opens in the second half, so the seabed
   arrives out of the haze instead of being there from the start. */
function tauchgang(ms){
  const hoch = anflugHoch, weit = anflugWeit;
  return new Promise(done => {
    const t0 = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - t0) / ms);
      // ease in and out: it takes a moment to start sinking, and it settles
      const fall = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      anflugHoch = hoch * (1 - fall);
      anflugWeit = weit * (1 - fall);

      const k = Math.min(1, Math.max(0, (t - 0.06) / 0.86));
      const klar = k * k * (3 - 2 * k);       // how far the water has opened
      if(env) env.setDive(1 - klar);
      backdrop.style.filter =
        `brightness(${(1 + 0.9 * (1 - klar)).toFixed(3)}) saturate(${(1 - 0.38 * (1 - klar)).toFixed(3)})`;

      if(t < 1) requestAnimationFrame(step);
      else {
        anflugHoch = 0; anflugWeit = 0;
        if(env) env.setDive(0);
        done();
      }
    };
    requestAnimationFrame(step);
  });
}


document.getElementById('enterBtn').addEventListener('click', leaveIntro);
document.querySelector('.mcentre h1').addEventListener('click', leaveIntro);

// a scroll, a key or a swipe does the same as the button
let introLock = 0;
function introGesture(dir){
  if(!introOpen || dir <= 0) return;
  const now = performance.now();
  if(now - introLock < 700) return;
  introLock = now;
  leaveIntro();
}
addEventListener('wheel', (e) => introGesture(e.deltaY), {passive:true});
addEventListener('keydown', (e) => {
  if(introOpen && ['ArrowDown','ArrowRight','Enter',' ','PageDown'].includes(e.key)) introGesture(1);
});
let introTouchY = null;
addEventListener('touchstart', (e) => { if(introOpen) introTouchY = e.touches[0].clientY; }, {passive:true});
addEventListener('touchmove', (e) => {
  if(introOpen && introTouchY !== null) introGesture(introTouchY - e.touches[0].clientY - 30);
}, {passive:true});

/* ============================================================
   Timeline axis
   ============================================================ */
const ticksEl = document.getElementById('ticks');
const decadesEl = document.getElementById('decades');
const markerEl = document.getElementById('marker');
const markerYear = document.getElementById('markerYear');

function yearToPercent(year){
  return ((year - minYear) / (maxYear - minYear)) * 100;
}

function buildTimeline(){
  ticksEl.innerHTML = DATA.map((spec, i) =>
    `<div class="tick" data-i="${i}" style="left:${yearToPercent(yearOf(spec))}%"
          title="${yearOf(spec)} — ${envTitle(spec)}"></div>`).join('');
  ticksEl.querySelectorAll('.tick').forEach(el => {
    el.addEventListener('click', () => {
      target = Number(el.dataset.i); clampTarget(); hideHint();
    });
  });

  // Pick a labelling step that yields roughly eight marks, whatever span the
  // chronology covers — the range changes whenever the years are re-based.
  const span = Math.max(1, maxYear - minYear);
  const steps = [10, 25, 50, 100, 250, 500, 1000, 2500];
  const step = steps.find(s => span / s <= 9) || steps[steps.length - 1];
  const first = Math.ceil(minYear / step) * step;
  let marks = '';
  for(let y = first; y <= maxYear; y += step){
    marks += `<div class="decade" style="left:${yearToPercent(y)}%"><i></i><span>${y}</span></div>`;
  }
  decadesEl.innerHTML = marks;
}

function updateTimeline(index){
  const pct = yearToPercent(yearOf(DATA[index]));
  markerEl.style.left = `${pct}%`;
  markerYear.textContent = String(yearOf(DATA[index]));
  ticksEl.querySelectorAll('.tick').forEach(el =>
    el.classList.toggle('on', Number(el.dataset.i) === index));
}

/* The overview shows whatever the archive is showing — the reconstruction or
   the sheet it came from. The reference specimen has no sheet of its own. */
function plateSrc(spec){
  return (mode === 'draw' && !spec.reference)
    ? `assets/img/drawing/${spec.id}.webp`
    : `assets/img/render/${spec.id}.webp`;
}

function refreshPlates(){
  if(!platesBuilt) return;
  platesEl.querySelectorAll('.plate').forEach(el =>
    el.querySelector('img').src = plateSrc(DATA[Number(el.dataset.i)]));
}

function buildPlates(){
  /* Only the drawings. The template is what they were all drawn over, not one
     of them, so it has no place in a sheet of a hundred and forty-seven. */
  platesEl.innerHTML = DATA.map((spec, i) => spec.reference ? '' : `
    <div class="plate" data-i="${i}" role="button" tabindex="0"
         title="${sciName(L(spec))} · ${yearOf(spec)}">
      <div class="imgwrap">
        <img decoding="async" src="${plateSrc(spec)}"
             alt="${sciName(L(spec))}, ${yearOf(spec)}"></div>
      <div class="sci">${sciName(L(spec))}</div>
    </div>`).join('');
  platesEl.querySelectorAll('.plate').forEach(el => {
    // back to the archive, standing at that specimen with its record open
    const open = () => {
      const i = Number(el.dataset.i);
      target = current = i; clampTarget();   // before setView measures the row
      setView('line');
      openInspect(i);
    };
    el.addEventListener('click', open);
    el.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
    });
  });
  platesBuilt = true;
}

/* ------------------------------------------------------------------
   Changing view is a rearrangement, not a cut
   ------------------------------------------------------------------
   The same specimens stand in both views. On the way to the overview they
   fly from where they stand on the archive's row into the cells they occupy
   in the grid; on the way back they fly the other way and dissolve into the
   models again. Only specimens near the screen travel: the row is long, and
   animating thirty-odd full images off stage would cost a lot to show nobody
   anything. */
const shuffleEl = document.createElement('div');
shuffleEl.id = 'shuffle';
shuffleEl.setAttribute('aria-hidden', 'true');
document.body.appendChild(shuffleEl);
let switching = false;

/* Where a specimen's plate sits in the overview. The grid is laid out even
   while it is transparent, so this reads true before the view is shown. */
function plateRect(index){
  const el = platesEl.querySelector(`.plate[data-i="${index}"] img`);
  if(!el) return null;
  const r = el.getBoundingClientRect();
  if(!r.width || !r.height) return null;
  return {left:r.left, top:r.top, width:r.width, height:r.height,
          src: el.currentSrc || el.src};
}

/* Where the same specimen stands on the archive's row, in screen pixels.
   Projected through the live camera, so it holds for any position along the
   row and for a record that has pushed the specimen to the left. */
function specimenRect(index, ratio){
  const wx = index * SPACING;
  const at = (y) => {
    const v = new THREE.Vector3(wx, y, 0).project(camera);
    return {x:(v.x * 0.5 + 0.5) * innerWidth, y:(-v.y * 0.5 + 0.5) * innerHeight};
  };
  const foot = at(0), head = at(FIT);
  const height = Math.max(1, foot.y - head.y);
  const width = height * ratio;
  return {left: foot.x - width / 2, top: head.y, width, height};
}

/* half a screen of slack, so nothing pops in right at the edge */
function onScreenish(r){
  return r && r.left < innerWidth * 1.5 && r.left + r.width > -innerWidth * 0.5
          && r.top < innerHeight * 1.5 && r.top + r.height > -innerHeight * 0.5;
}

/* The archive shows one specimen at a time; the other thirty-seven stand
   kilometres of row away and project to a few pixels hundreds of screens
   off. Flying them from there would show nothing at all. Instead they come
   in over the edge they actually lie beyond, at the size the row draws them,
   fanned by how far along they are — so the grid assembles out of the row's
   own direction rather than out of nowhere. */
function rowEntry(index, centre, ratio, reference){
  const height = reference.height;
  const width = height * ratio;
  const spill = Math.min(Math.abs(index - centre), 7) * width * 0.4;
  return {
    width, height, top: reference.top,
    left: index > centre ? innerWidth + spill : -width - spill,
  };
}

function flyer(src, from){
  const img = document.createElement('img');
  img.src = src;
  img.alt = '';
  img.style.left = `${from.left}px`;
  img.style.top = `${from.top}px`;
  img.style.width = `${from.width}px`;
  img.style.height = `${from.height}px`;
  shuffleEl.appendChild(img);
  return img;
}

function travel(img, from, to, {duration, delay, fadeOut}){
  const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
  const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
  const scale = to.height / from.height;
  // A piece heading back to the row dissolves into the model it lands on —
  // but only once it is nearly there, or it spends the whole flight as a ghost.
  return img.animate([
    {offset:0,    transform:'translate3d(0,0,0) scale(1)', opacity:1},
    {offset:0.72, opacity:1},
    {offset:1,    transform:`translate3d(${dx}px,${dy}px,0) scale(${scale})`,
                  opacity: fadeOut ? 0 : 1}
  ], {duration, delay, fill:'forwards', easing:'cubic-bezier(.34,.78,.22,1)'});
}

async function setView(next){
  const wantGrid = next === 'grid';
  if(gridOpen === wantGrid || switching) return;

  document.getElementById('viewGrid').classList.toggle('on', wantGrid);
  document.getElementById('viewLine').classList.toggle('on', !wantGrid);
  if(!platesBuilt) buildPlates();

  if(reducedMotion.matches){
    gridOpen = wantGrid;
    document.body.classList.toggle('gridding', wantGrid);
    gridEl.classList.toggle('on', wantGrid);
    if(wantGrid) gridEl.scrollTop = 0;
    return;
  }

  switching = true;
  placeCamera();            // measure against where the row really stands
  gridEl.scrollTop = 0;

  // Both ends of every journey, measured before anything moves. The grid is
  // laid out underneath already, so its cells can be read while it is still
  // transparent.
  const centre = Math.round(current);
  const reference = specimenRect(centre, 1);
  const trips = [];
  for(let i = 0; i < DATA.length; i++){
    const plate = plateRect(i);
    if(!plate) continue;
    const ratio = plate.width / plate.height;
    let row = specimenRect(i, ratio);
    if(!onScreenish(row)) row = rowEntry(i, centre, ratio, reference);
    const from = wantGrid ? row : plate;
    const to   = wantGrid ? plate : row;
    if(!onScreenish(from) && !onScreenish(to)) continue;
    // the one you were looking at moves first, the rest unspool outward
    trips.push({src: plate.src, from, to, rank: Math.abs(i - centre)});
  }

  document.body.classList.add('shuffling');
  document.body.classList.toggle('to-grid', wantGrid);   // only then does the canvas step out
  const pieces = trips.map(t => ({...t, img: flyer(t.src, t.from)}));
  // A copy that has not decoded yet starts its flight blank and only appears
  // somewhere in the middle of it. Once the wall is prebuilt this costs
  // nothing; the race keeps one slow image from holding the view hostage.
  await Promise.race([
    Promise.all(pieces.map(p => p.img.decode().catch(() => {}))),
    new Promise(r => setTimeout(r, 140)),
  ]);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  gridOpen = wantGrid;
  document.body.classList.toggle('gridding', wantGrid);
  gridEl.classList.toggle('on', wantGrid);    // the paper arrives behind them

  const runs = pieces.map(({img, from, to, rank}) => travel(img, from, to, {
    duration: 720, delay: Math.min(200, rank * 16), fadeOut: !wantGrid
  }));
  await Promise.all(runs.map(a => a.finished.catch(() => {})));

  // the cells come back first, then the copies go — the other order leaves
  // the grid blank for a frame
  document.body.classList.remove('shuffling');
  document.body.classList.remove('to-grid');
  shuffleEl.innerHTML = '';
  switching = false;
}
